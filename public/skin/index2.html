<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supreme Master Agent UI</title>
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: #0a0a0a;
            --neon-green: #39ff14;
            --neon-cyan: #00f3ff;
            --text-color: #e0e0e0;
            --border-glow: 0 0 10px rgba(57, 255, 20, 0.3);
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', monospace;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* Sidebar */
        #sidebar {
            width: 280px;
            background: var(--panel-bg);
            border-right: 1px solid #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 5px 0 20px rgba(0,0,0,0.5);
            z-index: 10;
        }
        h1 {
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
            font-size: 1.5rem;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        .control-group { margin-bottom: 20px; }
        label { display: block; color: #888; margin-bottom: 5px; font-size: 0.8rem; }
        select, input[type="text"] {
            width: 100%;
            background: #000;
            border: 1px solid #333;
            color: var(--neon-cyan);
            padding: 10px;
            font-family: inherit;
            outline: none;
            transition: 0.3s;
        }
        select:focus, input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.2);
        }
        
        /* Chat Area */
        #chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at center, #0a0a0a 0%, #000 100%);
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 15px;
            border-radius: 8px;
            line-height: 1.5;
            position: relative;
        }
        .user {
            align-self: flex-end;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.1);
        }
        .ai {
            align-self: flex-start;
            background: rgba(57, 255, 20, 0.05);
            border: 1px solid var(--neon-green);
            color: #fff;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.1);
        }
        .ai b { color: var(--neon-green); }
        
        /* Input Area */
        #input-area {
            padding: 20px;
            background: var(--panel-bg);
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
        }
        #user-input {
            flex: 1;
            background: #000;
            border: 1px solid #333;
            color: #fff;
            padding: 15px;
            font-family: inherit;
            font-size: 1rem;
        }
        button {
            background: transparent;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 0 25px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }
        button:hover {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 15px var(--neon-green);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-green); }
    </style>
</head>
<body>
    <div id="sidebar">
        <h1>SUPREME UI</h1>
        
        <div class="control-group">
            <label>PROJECT FOLDER</label>
            <select id="project-select">
                <option value="project1">project1</option>
                <option value="assemble">assemble</option>
                <option value="output">output</option>
            </select>
        </div>

        <div class="control-group">
            <label>AGENT MODE</label>
            <select id="mode-select">
                <option value="chat">💬 General Chat</option>
                <option value="code">💻 Code Generator</option>
            </select>
        </div>

        <div style="margin-top: auto; font-size: 0.7rem; color: #555;">
            Status: <span style="color: var(--neon-green);">● Online</span><br>
            Model: qwen3.5:0.8b
        </div>
    </div>

    <div id="chat-area">
        <div id="messages">
            <div class="message ai"><b>System:</b> Supreme Master Agent UI initialized. Ready for input.</div>
        </div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Enter your command or prompt..." autocomplete="off">
            <button onclick="sendMessage()">Execute</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const messages = document.getElementById('messages');
            const project = document.getElementById('project-select').value;
            const mode = document.getElementById('mode-select').value;
            const text = input.value;
            
            if (!text) return;

            // Add User Message
            messages.innerHTML += `<div class="message user"><b>You:</b> ${text}</div>`;
            input.value = '';
            messages.scrollTop = messages.scrollHeight;

            // Add AI Placeholder
            const aiMsgId = 'ai-' + Date.now();
            messages.innerHTML += `<div class="message ai" id="${aiMsgId}"><b>Qwen:</b> <span class="cursor">_</span></div>`;
            const aiDiv = document.getElementById(aiMsgId);
            const cursor = aiDiv.querySelector('.cursor');

            // Fetch Stream
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, mode: mode, project: project })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n').filter(l => l.trim());
                    
                    for (const line of lines) {
                        try {
                            const json = JSON.parse(line);
                            if (json.message && json.message.content) {
                                fullText += json.message.content;
                                // Simple formatting for code blocks
                                let formatted = fullText.replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, '<br>');
                                aiDiv.innerHTML = `<b>Qwen:</b> ${formatted}`;
                                messages.scrollTop = messages.scrollHeight;
                            }
                        } catch (e) {}
                    }
                }
            } catch (err) {
                aiDiv.innerHTML += `<br><span style="color:red">Error: ${err.message}</span>`;
            }
        }
        
        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
